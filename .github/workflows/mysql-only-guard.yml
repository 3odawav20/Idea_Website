name: MySQL-Only Architecture Guard

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  mysql-only-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - name: Enforce MySQL-only architecture (zero Firebase/Supabase/Firestore/PostgreSQL)
        run: node scripts/verify-mysql-only.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run regression tests
        run: node --test tests/*.test.mjs
      - name: Build frontend
        run: pnpm run build
