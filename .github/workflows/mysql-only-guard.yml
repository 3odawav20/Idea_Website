name: MySQL-Only Architecture Guard

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  mysql-only-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - name: Validate the approved PHP/MySQL architecture
        run: node scripts/verify-mysql-only.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run PHP/MySQL architecture regressions
        run: >-
          node --test
          tests/no-legacy-database-directory.test.mjs
          tests/ai-mysql-runpod-only.test.mjs
          tests/auth-connection.test.mjs
          tests/social-auth.test.mjs
          tests/live-visualizer-contract.test.mjs
          tests/company-control.test.mjs
          tests/admin-promotions.test.mjs
      - name: Verify dashboard PHP/MySQL contracts
        run: pnpm exec tsx --test tests/dashboards-php-mysql.test.ts
      - name: Build frontend
        run: pnpm run build
