name: IDEA visualizer checks
on:
  pull_request:
  push:
    branches: [main, 'recovery/**']
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd
      - name: Install app
        run: pnpm install --frozen-lockfile
      - name: Verify frontend TypeScript tests
        run: pnpm exec tsx --test tests/*.test.ts src/app/backend/authValidation.test.ts
      - name: Typecheck frontend and Vite config
        run: pnpm exec tsc --noEmit
      - name: Verify visualizer and marketplace regressions
        run: node --test tests/*.test.mjs
      - name: Verify auth connection regression checks
        run: node --test tests/auth-connection.test.mjs
      - name: Verify real material gallery dimensions and source images
        run: node --test tests/room3d-materials.test.mjs
      - name: Build application
        run: pnpm run build
      - name: Build cPanel bundle
        run: pnpm run build:cpanel
      - name: Check PHP syntax
        run: php -l server/cpanel/api/visualize.php && php -l server/cpanel/idea-accounts-api/platform-ai.php && php -l server/cpanel/api/tile-dimensions.php && php -l server/cpanel/api/marketplace.php
      - name: Verify PHP/MySQL AI role entitlements at runtime
        run: php tests/ai-role-policy.test.php
      - name: Verify manufacturer tile dimensions and lossless surface edits
        run: php tests/tile-physical-size.test.php && php tests/ai-mask-preservation.test.php
      - name: Check cPanel routing assets
        run: test -s dist/api/visualize.php && test -s dist/.htaccess
