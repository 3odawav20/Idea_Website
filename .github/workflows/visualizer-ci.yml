name: IDEA visualizer checks
on:
  pull_request:
  push:
    branches: [main, 'recovery/**']
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd
      - name: Install app
        run: npm ci --no-audit --no-fund
      - name: Verify visualizer tests
        run: node --test tests/*.test.mjs
      - name: Verify auth connection regression checks
        run: node --test tests/auth-connection.test.mjs
      - name: Build application
        run: npm run build
      - name: Build cPanel bundle
        run: npm run build:cpanel
      - name: Check PHP syntax
        run: php -l server/cpanel/api/visualize.php && php -l server/cpanel/idea-accounts-api/platform-ai.php && php -l server/cpanel/api/tile-dimensions.php && php -l server/cpanel/api/marketplace.php
      - name: Verify manufacturer tile dimensions and lossless surface edits
        run: php tests/tile-physical-size.test.php && php tests/ai-mask-preservation.test.php
      - name: Check cPanel routing assets
        run: test -s dist/api/visualize.php && test -s dist/.htaccess
