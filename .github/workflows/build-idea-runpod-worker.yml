name: Build IDEA Runpod mask worker
on:
  push:
    branches:
      - runpod/idea-mask-worker-20261115
    paths:
      - runpod/idea-mask-worker/**
      - .github/workflows/build-idea-runpod-worker.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout worker branch
        uses: actions/checkout@v4
      - name: Static syntax check
        run: python -m py_compile runpod/idea-mask-worker/handler.py
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push isolated Runpod worker container
        uses: docker/build-push-action@v6
        with:
          context: ./runpod/idea-mask-worker
          push: true
          platforms: linux/amd64
          tags: ghcr.io/3odawav20/idea-dh-qwen-mask:20261115-v2
          labels: |
            org.opencontainers.image.source=https://github.com/3odawav20/Idea_Website
            org.opencontainers.image.description=IDEA Qwen tile mask worker candidate
