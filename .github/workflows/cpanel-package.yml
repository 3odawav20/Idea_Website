name: cPanel release package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the workflow-dispatch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source commit
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          [[ "$EXPECTED_COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up PHP for source tests
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run repository JavaScript tests
        run: node --test tests/*.test.mjs

      - name: Run PHP/MySQL marketplace source-policy test
        run: php tests/marketplace-private-price-policy.test.php

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build cPanel package
        run: npm run build:cpanel

      - name: Verify package integrity and readiness label
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/verify-cpanel-release.mjs dist "$EXPECTED_COMMIT_SHA"

      - name: Create immutable package archive
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          archive="$RUNNER_TEMP/idea-cpanel-${EXPECTED_COMMIT_SHA}.tar.gz"
          tar -C dist -czf "$archive" .
          sha256sum "$archive" > "$archive.sha256"
          printf 'IDEA_CPanel_ARCHIVE=%s\n' "$archive"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: idea-cpanel-${{ github.sha }}
          path: |
            ${{ runner.temp }}/idea-cpanel-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/idea-cpanel-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
