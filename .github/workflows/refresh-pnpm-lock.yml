name: Refresh pnpm lockfile after dependency cleanup

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - ".github/workflows/refresh-pnpm-lock.yml"

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Regenerate lockfile from the approved manifest
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Commit the regenerated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh pnpm lockfile after dependency cleanup"
          git push origin HEAD:main
